name: Cisco Partner Intelligence

on:
  workflow_dispatch:

  schedule:
    # Every alternate Monday at 08:00 UTC (adjust as required)
    - cron: "0 8 */14 * 1"

permissions:
  contents: read

jobs:
  partner-intelligence:

    name: Run Cisco Partner Intelligence Pipeline

    runs-on: windows-latest

    timeout-minutes: 90

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Verify Python Installation
        shell: pwsh
        run: python --version

      - name: Upgrade pip
        shell: pwsh
        run: python -m pip install --upgrade pip

      - name: Install Dependencies
        shell: pwsh
        run: pip install -r requirements.txt

      - name: Execute Automation Pipeline
        shell: pwsh
        run: python run_all.py

      - name: Display Generated Files
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========== OUTPUT =========="
          if (Test-Path output) {
            Get-ChildItem output -Recurse
          }

          Write-Host ""
          Write-Host "========== DATA =========="
          if (Test-Path data) {
            Get-ChildItem data -Recurse
          }

      - name: Upload Business Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cisco-Partner-Report-${{ github.run_number }}
          path: output/
          retention-days: 30

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cisco-Partner-Logs-${{ github.run_number }}
          path: data/logs/
          retention-days: 30
