name: CISCO Partner Intelligence

on:
  workflow_dispatch:

jobs:
  test-environment:

    runs-on: windows-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python
        run: python --version

      - name: Install Dependencies
        run: pip install -r requirements.txt

      -  name: Run Automation
         run: python run_all.py

      - name: Upload Excel Report
        uses: actions/upload-artifact@v4
        with:
          name: Cisco-Partner-Report-${{ github.run_number }}
          path: output/Cisco_Partner_Master.xlsx
          retention-days: 30

      - name: Upload Logs
        uses: actions/upload-artifact@v4
        with:
          name: Logs-${{ github.run_number }}
          path: data/logs/
          retention-days: 30 

      - name: Upload Run History
        uses: actions/upload-artifact@v4
        with:
          name: Run-History-${{ github.run_number }}
          path: data/run_history.csv
          retention-days: 30
