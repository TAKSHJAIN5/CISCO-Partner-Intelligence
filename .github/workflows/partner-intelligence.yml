name: CISCO Partner Intelligence Automation

on:
  workflow_dispatch:

jobs:
  run-automation:

    runs-on: windows-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python
        run: python --version

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Automation
        run: python run_all.py

      - name: Display Generated Files
        shell: cmd
        run: |
          echo ============================
          echo OUTPUT
          echo ============================
          dir output

          echo.
          echo ============================
          echo DATA
          echo ============================
          dir data

          echo.
          echo ============================
          echo LOGS
          echo ============================
          dir data\logs

      - name: Upload Cisco Partner Output
        uses: actions/upload-artifact@v4
        with:
          name: Cisco-Partner-Output-${{ github.run_number }}
          path: output/
          retention-days: 30

      - name: Upload Cisco Partner Logs
        uses: actions/upload-artifact@v4
        with:
          name: Cisco-Partner-Logs-${{ github.run_number }}
          path: data/logs/
          retention-days: 30
