name: Cisco Partner Intelligence

on:
  workflow_dispatch:

  schedule:
    # Every alternate Monday at 08:00 UTC
    - cron: "0 8 */14 * 1"

permissions:
  contents: read

jobs:
  partner-intelligence:

    name: Run Cisco Partner Intelligence Pipeline

    runs-on: windows-latest

    timeout-minutes: 90

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Verify Python Installation
        shell: pwsh
        run: python --version

      - name: Upgrade pip
        shell: pwsh
        run: python -m pip install --upgrade pip

      - name: Install Dependencies
        shell: pwsh
        run: pip install -r requirements.txt

      - name: Execute Automation Pipeline
        shell: pwsh
        run: python run_all.py

      - name: Display Generated Files & Diagnostics
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "================ OUTPUT DIRECTORY ================"
          if (Test-Path output) {
            Get-ChildItem output -Recurse | Format-Table FullName, Length
          } else {
            Write-Host "Output directory not found."
          }

          Write-Host ""
          Write-Host "================ DATA DIRECTORY =================="
          if (Test-Path data) {
            Get-ChildItem data -Recurse | Format-Table FullName, Length
          } else {
            Write-Host "Data directory not found."
          }

          Write-Host ""
          Write-Host "================ CSV ROW COUNTS =================="

          if (Test-Path data) {
            Get-ChildItem data -Filter *.csv | ForEach-Object {
              $lines = (Get-Content $_.FullName).Count
              $rows = [Math]::Max($lines - 1, 0)
              Write-Host "$($_.Name): $rows rows"
            }
          }

          Write-Host ""
          Write-Host "================ JSON FILES ======================"

          if (Test-Path output) {
            Get-ChildItem output -Filter *.json
          }

      - name: Upload Business Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cisco-Partner-Report-${{ github.run_number }}
          path: output/
          retention-days: 30

      - name: Upload Pipeline Data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cisco-Partner-Pipeline-${{ github.run_number }}
          path: |
            data/
            output/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cisco-Partner-Logs-${{ github.run_number }}
          path: data/logs/
          if-no-files-found: warn
          retention-days: 30
